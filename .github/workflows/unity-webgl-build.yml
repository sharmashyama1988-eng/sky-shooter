name: Build and deploy WebGL

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Cache between runs (optional)
      - name: Cache Unity build
        uses: actions/cache@v4
        with:
          path: |
            Library
          key: ${{ runner.os }}-unity-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-unity-

      # Setup Unity (game-ci/unity-builder)
      - name: Setup Unity
        uses: game-ci/unity-builder@v2
        with:
          unityVersion: 2022.3.0f1  # set specific patch to match installed editor

      # Build project for WebGL
      - name: Build for WebGL
        uses: game-ci/unity-builder@v2
        with:
          targetPlatform: WebGL
          buildName: WebGLBuild
          projectPath: .
          buildPath: build/WebGL

      # Deploy to gh-pages
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/WebGL
          publish_branch: gh-pages

# Notes:
# - This workflow may require Unity activation if using a paid license.
# - Alternatives:
#   * Build WebGL locally and push the build to gh-pages branch manually
#   * Use cached local build workflow (dev-friendly)